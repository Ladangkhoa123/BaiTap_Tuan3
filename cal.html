<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f4f6">
  <title>Máy tính</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #202124;
      background: #f3f4f6;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 280px;
      min-height: 100vh;
      display: grid;
      place-items: center;
      margin: 0;
      padding: 24px 14px;
      background:
        radial-gradient(ellipse at 18% 8%, rgb(100 149 237 / 12%), transparent 34%),
        #f3f4f6;
    }

    .calculator {
      width: min(100%, 360px);
      padding: 12px;
      border: 1px solid #dedede;
      border-radius: 12px;
      background: #fff;
      box-shadow: 0 12px 36px rgb(0 0 0 / 12%);
    }

    .calculator-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 28px;
      margin: 0 2px 8px;
    }

    h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 600;
    }

    .keyboard-hint {
      margin: 0;
      color: #777;
      font-size: 0.7rem;
    }

    .display {
      min-height: 70px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      overflow: hidden;
      margin-bottom: 10px;
      padding: 8px 11px 5px;
      border: 1px solid #c8c8c8;
      border-radius: 3px;
      background: #fff;
      text-align: right;
    }

    .expression {
      min-height: 20px;
      overflow: hidden;
      color: #777;
      font-size: 0.83rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .current-value {
      overflow: hidden;
      color: #111;
      font-size: 2rem;
      font-weight: 400;
      line-height: 1.15;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status {
      min-height: 19px;
      margin: 0 2px 5px;
      color: #707070;
      font-size: 0.72rem;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
    }

    button {
      min-width: 0;
      min-height: 42px;
      padding: 5px 8px;
      border: 1px solid #d4d4d4;
      border-radius: 4px;
      background: linear-gradient(#fff, #f5f5f5);
      color: #111;
      cursor: pointer;
      font: inherit;
      font-size: 1.08rem;
      transition: background 120ms ease, border-color 120ms ease, transform 80ms ease;
      user-select: none;
    }

    button:hover {
      border-color: #b8c7dc;
      background: #eaf2fc;
    }

    button:active {
      transform: translateY(1px);
      background: #dce9f8;
    }

    button:focus-visible {
      outline: 2px solid #3978c6;
      outline-offset: 2px;
    }

    .function-key {
      background: linear-gradient(#f8f8f8, #e5e5e5);
      font-size: 0.95rem;
    }

    .utility-key {
      border-color: #cf4d42;
      background: linear-gradient(#e8675b, #d94c40);
      color: #fff;
      font-size: 0.92rem;
      font-weight: 650;
    }

    .utility-key:hover {
      border-color: #c63f34;
      background: #d94c40;
    }

    .operator-key {
      border-color: #444;
      background: linear-gradient(#606060, #414141);
      color: #fff;
      font-size: 1.2rem;
      font-weight: 600;
    }

    .operator-key:hover {
      border-color: #323232;
      background: #4a4a4a;
    }

    .equals-key {
      grid-column: span 2;
      border-color: #3982d8;
      background: linear-gradient(#67a9f4, #3982db);
      color: #fff;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .equals-key:hover {
      border-color: #2770c5;
      background: #3982db;
    }

    @media (max-width: 340px) {
      .keypad {
        gap: 6px;
      }

      button {
        min-height: 40px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="calculator" aria-label="Máy tính số học">
    <header class="calculator-header">
      <h1>Máy tính</h1>
      <p class="keyboard-hint">Có thể dùng bàn phím</p>
    </header>

    <section class="display" aria-label="Màn hình máy tính" aria-live="polite" aria-atomic="true">
      <div class="expression" id="expression" aria-label="Biểu thức"></div>
      <output class="current-value" id="current-value" aria-label="Giá trị hiện tại">0</output>
    </section>
    <p class="status" id="status" role="status">Sẵn sàng</p>

    <section class="keypad" id="keypad" aria-label="Bàn phím máy tính">
      <button class="function-key" type="button" data-action="parenthesis" data-value="(" aria-label="Mở ngoặc">(</button>
      <button class="function-key" type="button" data-action="parenthesis" data-value=")" aria-label="Đóng ngoặc">)</button>
      <button class="utility-key" type="button" data-action="backspace" aria-label="Xóa ký tự cuối">←</button>
      <button class="utility-key" type="button" data-action="clear" aria-label="Xóa tất cả">CA</button>

      <button class="function-key" type="button" data-action="square" aria-label="Bình phương">x<sup>2</sup></button>
      <button class="function-key" type="button" data-action="sqrt" aria-label="Căn bậc hai">√</button>
      <button class="function-key" type="button" data-action="percent" aria-label="Phần trăm">%</button>
      <button class="operator-key" type="button" data-action="operator" data-value="/" aria-label="Chia">÷</button>

      <button type="button" data-action="digit" data-value="7">7</button>
      <button type="button" data-action="digit" data-value="8">8</button>
      <button type="button" data-action="digit" data-value="9">9</button>
      <button class="operator-key" type="button" data-action="operator" data-value="*" aria-label="Nhân">×</button>

      <button type="button" data-action="digit" data-value="4">4</button>
      <button type="button" data-action="digit" data-value="5">5</button>
      <button type="button" data-action="digit" data-value="6">6</button>
      <button class="operator-key" type="button" data-action="operator" data-value="-" aria-label="Trừ">−</button>

      <button type="button" data-action="digit" data-value="1">1</button>
      <button type="button" data-action="digit" data-value="2">2</button>
      <button type="button" data-action="digit" data-value="3">3</button>
      <button class="operator-key" type="button" data-action="operator" data-value="+" aria-label="Cộng">+</button>

      <button type="button" data-action="digit" data-value="0">0</button>
      <button type="button" data-action="decimal" aria-label="Dấu thập phân">.</button>
      <button class="equals-key" type="button" data-action="equals" aria-label="Bằng">=</button>
    </section>
  </main>

  <script>
    const expressionDisplay = document.querySelector("#expression");
    const currentValueDisplay = document.querySelector("#current-value");
    const statusDisplay = document.querySelector("#status");
    const keypad = document.querySelector("#keypad");
    const numberFormat = new Intl.NumberFormat("vi-VN", {
      maximumFractionDigits: 10
    });

    let expression = "";
    let justEvaluated = false;

    // Định dạng số theo quy ước tiếng Việt để hiển thị gọn trên màn hình.
    function formatNumber(value) {
      if (!Number.isFinite(value)) {
        return "Không xác định";
      }

      return numberFormat.format(value);
    }

    // Đóng các dấu ngoặc còn mở khi biểu thức kết thúc bằng một toán hạng hợp lệ.
    function closeOpenParentheses(value) {
      let openCount = 0;

      for (const character of value) {
        if (character === "(") {
          openCount += 1;
        } else if (character === ")") {
          openCount -= 1;
        }
      }

      if (openCount < 0) {
        throw new Error("Số dấu ngoặc chưa hợp lệ");
      }

      return value + ")".repeat(openCount);
    }

    // Phân tích và tính biểu thức bằng bộ phân tích cú pháp, không dùng eval.
    function calculateExpression(value) {
      let position = 0;

      // Bỏ qua khoảng trắng nếu biểu thức có khoảng trắng.
      function skipWhitespace() {
        while (/\s/.test(value[position] || "")) {
          position += 1;
        }
      }

      // Đọc một biểu thức cộng hoặc trừ từ trái sang phải.
      function parseExpression() {
        let result = parseTerm();
        skipWhitespace();

        while (value[position] === "+" || value[position] === "-") {
          const operator = value[position];
          position += 1;
          const right = parseTerm();
          result = operator === "+" ? result + right : result - right;
          skipWhitespace();
        }

        return result;
      }

      // Đọc phép nhân hoặc chia; mức ưu tiên cao hơn cộng và trừ.
      function parseTerm() {
        let result = parseUnary();
        skipWhitespace();

        while (value[position] === "*" || value[position] === "/") {
          const operator = value[position];
          position += 1;
          const right = parseUnary();

          if (operator === "/" && right === 0) {
            throw new Error("Không thể chia cho 0");
          }

          result = operator === "*" ? result * right : result / right;
          skipWhitespace();
        }

        return result;
      }

      // Đọc dấu âm, dấu dương hoặc căn bậc hai trước toán hạng.
      function parseUnary() {
        skipWhitespace();

        if (value[position] === "+") {
          position += 1;
          return parseUnary();
        }

        if (value[position] === "-") {
          position += 1;
          return -parseUnary();
        }

        if (value[position] === "√") {
          position += 1;
          const radicand = parseUnary();

          if (radicand < 0) {
            throw new Error("Không thể tính căn bậc hai của số âm");
          }

          return Math.sqrt(radicand);
        }

        return parsePostfix();
      }

      // Đọc số mũ và phần trăm sau một toán hạng.
      function parsePostfix() {
        let result = parsePrimary();
        skipWhitespace();

        while (value[position] === "^" || value[position] === "%") {
          const operator = value[position];
          position += 1;

          if (operator === "^") {
            result = Math.pow(result, parseUnary());
          } else {
            result /= 100;
          }

          skipWhitespace();
        }

        return result;
      }

      // Đọc một số hoặc một biểu thức được đặt trong dấu ngoặc.
      function parsePrimary() {
        skipWhitespace();

        if (value[position] === "(") {
          position += 1;
          const result = parseExpression();
          skipWhitespace();

          if (value[position] !== ")") {
            throw new Error("Thiếu dấu đóng ngoặc");
          }

          position += 1;
          return result;
        }

        const numberMatch = value.slice(position).match(/^(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?/i);

        if (!numberMatch) {
          throw new Error("Biểu thức chưa hoàn chỉnh");
        }

        position += numberMatch[0].length;
        return Number(numberMatch[0]);
      }

      const result = parseExpression();
      skipWhitespace();

      if (position !== value.length) {
        throw new Error("Biểu thức không hợp lệ");
      }

      if (!Number.isFinite(result)) {
        throw new Error("Kết quả vượt giới hạn");
      }

      return result;
    }

    // Trả về vị trí bắt đầu của toán hạng cuối để áp dụng bình phương hoặc căn.
    function findLastOperandStart(value) {
      let end = value.length;

      while (value[end - 1] === "%") {
        end -= 1;
      }

      if (end === 0) {
        return -1;
      }

      if (value[end - 1] === ")") {
        let depth = 0;

        for (let index = end - 1; index >= 0; index -= 1) {
          if (value[index] === ")") {
            depth += 1;
          } else if (value[index] === "(") {
            depth -= 1;

            if (depth === 0) {
              return index > 0 && value[index - 1] === "√" ? index - 1 : index;
            }
          }
        }

        return -1;
      }

      const numberMatch = value.slice(0, end).match(/(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?$/i);
      return numberMatch ? end - numberMatch[0].length : -1;
    }

    // Cập nhật biểu thức nhỏ phía trên và giá trị hiện tại trên màn hình.
    function renderDisplay() {
      expressionDisplay.textContent = expression
        .replaceAll("*", "×")
        .replaceAll("/", "÷")
        .replaceAll("-", "−");

      const lastNumber = expression.match(/(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?/gi);
      let displayValue = lastNumber ? lastNumber[lastNumber.length - 1] : "0";

      if (expression && /[)%]$/.test(expression)) {
        try {
          displayValue = String(calculateExpression(closeOpenParentheses(expression)));
        } catch {
          displayValue = lastNumber ? lastNumber[lastNumber.length - 1] : "0";
        }
      }

      const numericValue = Number(displayValue);
      currentValueDisplay.textContent = Number.isFinite(numericValue)
        ? formatNumber(numericValue)
        : displayValue;
    }

    // Thêm một chữ số vào biểu thức và xử lý bắt đầu phép tính mới sau dấu bằng.
    function inputDigit(digit) {
      if (justEvaluated) {
        expression = "";
        justEvaluated = false;
      }

      if (/[)%]$/.test(expression)) {
        expression += "*";
      }

      expression += digit;
      statusDisplay.textContent = "Đang nhập phép tính";
      renderDisplay();
    }

    // Thêm dấu thập phân vào số đang nhập và không cho nhập dấu chấm hai lần.
    function inputDecimal() {
      if (justEvaluated) {
        expression = "";
        justEvaluated = false;
      }

      if (/[)%]$/.test(expression)) {
        expression += "*";
      }

      const currentNumber = expression.match(/(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?$/i);

      if (currentNumber && currentNumber[0].includes(".")) {
        return;
      }

      if (!expression || /[+\-*/(]$/.test(expression)) {
        expression += "0";
      }

      expression += ".";
      statusDisplay.textContent = "Đang nhập phép tính";
      renderDisplay();
    }

    // Thêm toán tử vào biểu thức hoặc thay toán tử cuối nếu chưa có toán hạng tiếp theo.
    function inputOperator(operator) {
      if (justEvaluated) {
        justEvaluated = false;
      }

      if (!expression) {
        if (operator === "-") {
          expression = "-";
        } else {
          return;
        }
      } else if (/[+\-*/]$/.test(expression)) {
        if (expression.length === 1 && expression === "-" && operator !== "-") {
          return;
        }

        expression = expression.slice(0, -1) + operator;
      } else {
        expression += operator;
      }

      statusDisplay.textContent = "Đang nhập phép tính";
      renderDisplay();
    }

    // Thêm dấu ngoặc và tự chèn phép nhân khi ngoặc mở đứng sau một toán hạng.
    function inputParenthesis(parenthesis) {
      if (parenthesis === "(") {
        if (justEvaluated) {
          justEvaluated = false;
        }

        if (/[0-9)%]$/.test(expression)) {
          expression += "*";
        }

        expression += "(";
      } else {
        const openCount = (expression.match(/\(/g) || []).length;
        const closeCount = (expression.match(/\)/g) || []).length;

        if (openCount <= closeCount || !/[0-9)%]$/.test(expression)) {
          return;
        }

        expression += ")";
      }

      statusDisplay.textContent = "Đang nhập phép tính";
      renderDisplay();
    }

    // Áp dụng nút phần trăm lên toán hạng hiện tại.
    function inputPercent() {
      if (/[0-9)]$/.test(expression)) {
        expression += "%";
        justEvaluated = false;
        statusDisplay.textContent = "Đang nhập phép tính";
        renderDisplay();
      }
    }

    // Bình phương hoặc lấy căn bậc hai của toán hạng cuối trong biểu thức.
    function applyUnaryOperation(operation) {
      const operandStart = findLastOperandStart(expression);

      if (operandStart === -1) {
        if (operation === "sqrt" && !expression) {
          expression = "√(";
          justEvaluated = false;
          statusDisplay.textContent = "Đang nhập phép tính";
          renderDisplay();
        }

        return;
      }

      const operand = expression.slice(operandStart);

      if (operation === "square") {
        expression += "^2";
      } else {
        expression = expression.slice(0, operandStart) + "√(" + operand + ")";
      }

      justEvaluated = false;
      statusDisplay.textContent = "Đang nhập phép tính";
      renderDisplay();
    }

    // Xóa ký tự cuối cùng; nếu vừa tính xong thì xóa luôn kết quả để bắt đầu lại.
    function backspace() {
      if (justEvaluated) {
        expression = "";
        justEvaluated = false;
      } else {
        expression = expression.slice(0, -1);
      }

      statusDisplay.textContent = "Đang nhập phép tính";
      renderDisplay();
    }

    // Xóa toàn bộ biểu thức, đưa màn hình về 0 và đặt trạng thái ban đầu.
    function clearCalculator() {
      expression = "";
      justEvaluated = false;
      statusDisplay.textContent = "Sẵn sàng";
      renderDisplay();
    }

    // Tính biểu thức hiện tại, tự đóng ngoặc còn thiếu và báo lỗi nếu biểu thức sai.
    function performCalculation() {
      if (!expression) {
        return;
      }

      try {
        const completeExpression = closeOpenParentheses(expression);
        const result = calculateExpression(completeExpression);
        expression = String(result);
        justEvaluated = true;
        statusDisplay.textContent = "Đã tính xong";
        renderDisplay();
      } catch (error) {
        statusDisplay.textContent = error instanceof Error ? error.message : "Biểu thức không hợp lệ";
      }
    }

    // Chuyển hành động của một nút bấm đến hàm xử lý tương ứng.
    function handleButtonClick(event) {
      const button = event.target.closest("button[data-action]");

      if (!button) {
        return;
      }

      const action = button.dataset.action;
      const value = button.dataset.value;

      if (action === "digit") {
        inputDigit(value);
      } else if (action === "decimal") {
        inputDecimal();
      } else if (action === "operator") {
        inputOperator(value);
      } else if (action === "parenthesis") {
        inputParenthesis(value);
      } else if (action === "percent") {
        inputPercent();
      } else if (action === "square" || action === "sqrt") {
        applyUnaryOperation(action);
      } else if (action === "backspace") {
        backspace();
      } else if (action === "clear") {
        clearCalculator();
      } else if (action === "equals") {
        performCalculation();
      }
    }

    // Cho phép nhập số và phép tính bằng bàn phím thay vì chỉ dùng các nút trên trang.
    function handleKeyboardInput(event) {
      const key = event.key;

      if (/^\d$/.test(key)) {
        inputDigit(key);
      } else if (key === "." || key === ",") {
        inputDecimal();
      } else if (["+", "-", "*", "/"].includes(key)) {
        inputOperator(key);
      } else if (key === "(" || key === ")") {
        inputParenthesis(key);
      } else if (key === "%") {
        inputPercent();
      } else if (key === "^") {
        applyUnaryOperation("square");
      } else if (key.toLowerCase() === "r") {
        applyUnaryOperation("sqrt");
      } else if (key === "Enter" || key === "=") {
        event.preventDefault();
        performCalculation();
      } else if (key === "Backspace") {
        backspace();
      } else if (key === "Escape" || key === "Delete") {
        clearCalculator();
      } else {
        return;
      }

      if (key !== "Enter" && key !== "=") {
        event.preventDefault();
      }
    }

    keypad.addEventListener("click", handleButtonClick);
    document.addEventListener("keydown", handleKeyboardInput);
    renderDisplay();
  </script>
</body>
</html>

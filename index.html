<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flexbox và CSS Grid</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
    }

    .container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
    }

    .content {
      width: min(100%, 960px);
    }

    h1 {
      margin: 0 0 12px;
      text-align: center;
      font-size: clamp(1.75rem, 4vw, 2.5rem);
    }

    .description {
      margin: 0 0 32px;
      text-align: center;
      line-height: 1.6;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
    }

    .card {
      min-height: 160px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      border-radius: 10px;
      text-align: center;
    }

    .card h2 {
      margin: 0 0 8px;
      font-size: 1.2rem;
    }

    .card p {
      margin: 0;
      line-height: 1.5;
    }

    @media (max-width: 640px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
  <link rel="stylesheet" href="colors.css">
</head>
<body>
  <main class="container">
    <section class="content" aria-labelledby="page-title">
      <h1 id="page-title">Flexbox và CSS Grid</h1>
      <p class="description">
        Flexbox căn giữa nội dung trên trang; CSS Grid sắp xếp các thẻ thành ba cột.
      </p>
      <div class="grid">
        <article class="card">
          <div>
            <h2>Thẻ thứ nhất</h2>
            <p>Nội dung được căn giữa bằng Flexbox.</p>
          </div>
        </article>
        <article class="card">
          <div>
            <h2>Thẻ thứ hai</h2>
            <p>Các cột có chiều rộng bằng nhau.</p>
          </div>
        </article>
        <article class="card">
          <div>
            <h2>Thẻ thứ ba</h2>
            <p>Lưới có khoảng cách 20px và góc bo 10px.</p>
          </div>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
